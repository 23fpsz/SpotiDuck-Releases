name: Update AdBlock Hosts

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-adblock-hosts.yml'

permissions:
  contents: write

jobs:
  update-hosts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and Compile AdBlock Domains
        run: |
          python3 - << 'EOF'
          import urllib.request
          import re

          urls = [
              # --- Brave Shields Official First-Party List ---
              "https://raw.githubusercontent.com/brave/adblock-lists/master/brave-lists/brave-firstparty.txt",

              # --- Web Player & Mobile Ad Server Filters ---
              "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters.txt",
              "https://raw.githubusercontent.com/AdguardTeam/AdguardFilters/master/MobileFilter/sections/adservers.txt"
          ]

          # Core Spotify Ad, Tracking, and Audio Injection Domains
          # ONLY these verified ad/tracking endpoints from the Spotify/SCDN family are blocked.
          core_ad_domains = [
              "audio-ads.spotify.com",
              "ads-akp.spotify.com",
              "ads-fa.spotify.com",
              "ads-fa.scdn.co",
              "mp3ad.scdn.co",
              "adstudio-assets.scdn.co",
              "adstudio.spotify.com",
              "adeventtracker.spotify.com",
              "pixel.spotify.com",
              "pixel-static.spotify.com",
              "aet.spotify.com",
              "doubleclick.net",
              "googlesyndication.com",
              "amillionads.com",
              "2mdn.net",
              "adxcel.com",
              "fastly-insights.com",
              "sentry.io",
              "adsrvr.org",
              "tracker.samplicio.us",
              "t.6sc.co",
              "adswizz.com",
              "tritondigital.com",
              "omny.fm"
          ]

          spotify_family_suffixes = [
              "spotify.com",
              "scdn.co",
              "spotifycdn.com",
              "spotifycdn.net"
          ]

          domains = set()

          for u in urls:
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                  with urllib.request.urlopen(req, timeout=15) as res:
                      content = res.read().decode('utf-8', errors='ignore')
                      for line in content.splitlines():
                          line = line.strip()
                          if not line or line.startswith('#') or line.startswith('!'):
                              continue
                          
                          # Skip Cosmetic Element-Hiding CSS rules (e.g. domain.com##.ad-banner)
                          if '##' in line or '#@#' in line or '#?#' in line:
                              continue
                          
                          # Remove inline comments
                          if '#' in line:
                              line = line.split('#')[0].strip()
                          if '!' in line:
                              line = line.split('!')[0].strip()
                          
                          # Clean AdGuard ||domain^ syntax
                          if line.startswith('||'):
                              line = line[2:]
                          if '^' in line:
                              line = line.split('^')[0]
                          
                          # Clean hosts file 0.0.0.0 / 127.0.0.1 prefix
                          parts = line.split()
                          if len(parts) >= 2 and parts[0] in ['0.0.0.0', '127.0.0.1']:
                              line = parts[1]
                          elif len(parts) == 1:
                              line = parts[0]
                          
                          # Validate clean domain
                          line = line.lower().strip()
                          if re.match(r'^[a-z0-9\.\-]+$', line) and '.' in line and not line.startswith('.') and not line.endswith('.'):
                              # Never allow Spotify/SCDN infrastructure, audio streaming, or API domains to be blocked
                              is_spotify = any(line == suf or line.endswith('.' + suf) for suf in spotify_family_suffixes)
                              if not is_spotify:
                                  domains.add(line)
              except Exception as e:
                  print(f"Failed to fetch {u}: {e}")

          # Add verified explicit ad domains
          for d in core_ad_domains:
              domains.add(d)

          sorted_domains = sorted(list(domains))
          print(f"Compiled {len(sorted_domains)} unique ad domains.")

          # Write out clean compiled adblock_hosts.txt file at repository root
          with open("adblock_hosts.txt", "w", encoding="utf-8") as f:
              f.write("# SpotiDuck Compiled AdBlock Hostlist\n")
              f.write("# Auto-updated daily from Brave Shields, uBlock Origin, & AdGuard Mobile Filter\n\n")
              for d in sorted_domains:
                  f.write(f"0.0.0.0 {d}\n")
          EOF

      - name: Commit and Push Updated Hostlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adblock_hosts.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(adblock): auto-update compiled adblock_hosts.txt" && git push)
